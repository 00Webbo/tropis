# Profile: local-cpu. See docs/model-profiles.md.
#
# For: clusters whose data must not leave and that have no GPU. It is slow
# (3 to 13 minutes per analysed node on a 16-thread desktop CPU) and wrong
# more often than local-gpu-8gb.
# Needs: an Ollama server reachable from the cluster, with the model pulled
# (`ollama pull qwen3.5:4b`), and about 4 GB of free RAM for it.
# Candidates are analysed one after another, so a sweep runs hourly with a
# longer timeout; a sweep still running when the next is due makes that one
# skip. Keep the default contextTokens: a larger window did not stop this
# model's occasional runaway reasoning, it only made the failure take
# longer to arrive.
# Leaves the cluster: nothing.
backend:
  provider: local
  baseURL: http://ollama.ollama:11434
  model: qwen3.5:4b
sweep:
  schedule: "0 * * * *"
  timeout: 2h
