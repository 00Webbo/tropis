# `helm test`: analyse the node this pod lands on, write the NodeHealthReport,
# and fail unless a valid verdict came back.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tropis.fullname" . }}-test-analyze
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tropis.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- include "tropis.analyzerPod" (dict "root" . "args" (list "analyze" "$(NODE_NAME)" "--write-report" "--json")) | nindent 2 }}
