{{- if .Values.alerting.prometheusRule.enabled }}
# Alerts on NodeHealthReports and on the sweep CronJob, through metrics
# kube-state-metrics exports. See docs/alerting.md for the kube-state-metrics
# configuration this depends on.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tropis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tropis.labels" . | nindent 4 }}
    {{- with .Values.alerting.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: tropis
      rules:
        - alert: TropisCausalVerdict
          expr: tropis_nodehealthreport_confidence{relationship="causal"} >= {{ .Values.alerting.prometheusRule.minConfidence }}
          labels:
            severity: {{ .Values.alerting.prometheusRule.severity }}
          annotations:
            summary: "Tropis: {{`{{ $labels.node }}`}} has a causal {{`{{ $labels.layer }}`}}-layer verdict"
            description: >-
              Tropis judges that a {{`{{ $labels.layer }}`}}-layer fault on node {{`{{ $labels.node }}`}}
              explains its Kubernetes-layer symptoms (confidence {{`{{ $value }}`}}).
              Evidence and the advisory next step: kubectl get nodehealthreport {{`{{ $labels.node }}`}} -o yaml.
              Tropis has taken no action.
        - alert: TropisSweepStale
          # A sweep that has stopped succeeding looks like silence. Per-report
          # age cannot show it: the sweep rewrites only raised or causal
          # nodes, so a quiet node's report ages legitimately, and a healthy
          # cluster may have no reports at all. Allows three missed runs of
          # the CronJob's own schedule; needs kube-state-metrics' CronJob
          # metrics (on by default).
          expr: |-
            time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "tropis.fullname" . }}-sweep"}
              > 3 * (kube_cronjob_next_schedule_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "tropis.fullname" . }}-sweep"}
                     - kube_cronjob_status_last_schedule_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "tropis.fullname" . }}-sweep"})
          labels:
            severity: info
          annotations:
            summary: "Tropis: the sweep has not succeeded for three scheduled runs"
            description: >-
              No run of CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} has succeeded
              for three schedule intervals, so NodeHealthReports are not being refreshed.
              Check its recent Jobs: kubectl -n {{`{{ $labels.namespace }}`}} get jobs.
{{- end }}
