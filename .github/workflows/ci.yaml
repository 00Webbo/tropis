name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The recipes live in the Makefile; these jobs only install tools and call it.
#
# Go modules and build cache: only the test job, which builds everything,
# saves the cache. The others restore it, so the saved entry is never a
# smaller job's subset.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@v5
      - run: make fmt-check vet test-race npd-test helm-lint
      - name: generated files are current
        # Stricter than make check-generated: any change anywhere fails.
        run: |
          make generate
          git diff --exit-code
      - name: replay the development corpus
        run: make eval-dev SEED=1
      - uses: actions/upload-artifact@v7
        with:
          name: dev-eval-report-not-publishable
          path: eval/results/dev/

  inject:
    runs-on: ubuntu-latest
    # GitHub-hosted runners use the Azure kernel, which is built without
    # dm-dust, so CI covers the dm-error fallback; a runner kernel with
    # dm-dust would be tested automatically. The dm-dust path is exercised on
    # the capture rig: `make inject-test REQUIRE_DUST=1`.
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - run: make inject-test

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v5
      - run: make kind-e2e

  commits:
    # Conventional Commits and DCO sign-off on every commit in the PR. Pull
    # requests are rebase-merged, so the commits are what lands on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash hack/check-commits.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
