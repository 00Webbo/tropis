name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the repository is 00Webbo/tropis.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          # SBOM and SLSA provenance attached to the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: sign
        run: cosign sign --yes ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
