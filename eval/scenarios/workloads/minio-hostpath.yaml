# An object store on a hostPath, with a client uploading and reading back.
apiVersion: v1
kind: Namespace
metadata: {name: tropis-eval}
---
apiVersion: v1
kind: Pod
metadata:
  name: minio-0
  namespace: tropis-eval
  labels: {app: minio, tropis.io/eval: "true"}
spec:
  nodeSelector: {kubernetes.io/hostname: "${TROPIS_NODE}"}
  containers:
    - name: minio
      image: minio/minio:RELEASE.2024-10-13T13-34-11Z
      args: [server, /data]
      env:
        - {name: MINIO_ROOT_USER, value: evaluser}
        - {name: MINIO_ROOT_PASSWORD, value: eval-placeholder}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 1Gi}
      livenessProbe:
        httpGet: {path: /minio/health/live, port: 9000}
        periodSeconds: 5
        timeoutSeconds: 3
      volumeMounts:
        - {name: data, mountPath: /data}
    - name: client
      image: minio/mc:RELEASE.2024-10-08T09-37-26Z
      command:
        - sh
        - -c
        - |
          until mc alias set local http://127.0.0.1:9000 evaluser eval-placeholder; do sleep 1; done
          mc mb -p local/eval
          while true; do
            head -c 1048576 /dev/urandom > /tmp/o
            mc cp /tmp/o local/eval/o-$RANDOM || true
            mc ls local/eval > /dev/null || true
            sleep 1
          done
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 128Mi}
  volumes:
    - name: data
      hostPath: {path: "${TROPIS_MOUNT}/minio", type: DirectoryOrCreate}
